<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbis Romanus — place the provinces of the Roman world</title>
<meta name="description" content="A Latin place name appears — click the map where it belonged. Your error is scored in Roman miles.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://orbis-omega.vercel.app">
<meta property="og:title" content="Orbis Romanus">
<meta property="og:description" content="Place Latin names from the Roman world on the map. Your guess is scored in Roman miles.">
<meta property="og:image" content="https://orbis-omega.vercel.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Orbis Romanus">
<meta name="twitter:description" content="Place Latin names from the Roman world on the map. Your guess is scored in Roman miles.">
<meta name="twitter:image" content="https://orbis-omega.vercel.app/og-image.png">
<style>
  /* Starter palette. Visual identity is intentionally a later stage —
     see CLAUDE.md. Deliberately NOT the parchment/serif/terracotta default. */
  :root{
    --sea:#12233b; --land:#d8cdb0; --land-line:#9c8f6e;
    --river:#4f7a8a; --ink:#1b2534; --paper:#ece3cf;
    --accent:#b06a3a; --good:#3f7d4f; --ok:#c1912e; --fair:#c8722f; --miss:#a8402c;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       color:var(--ink);background:#e7ddc6}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  h1{font-size:22px;letter-spacing:.02em;margin:.2em 0}
  .muted{color:#5a5340;font-size:14px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
  button{font:inherit;padding:7px 12px;border:1px solid #b3a684;border-radius:8px;
         background:var(--paper);color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}

  /* ---- start screen ---- */
  .startscreen{background:var(--paper);border:1px solid #b3a684;border-radius:12px;
               padding:20px;max-width:560px;margin:18px 0;
               box-shadow:0 6px 24px rgba(0,0,0,.12)}
  .startscreen h2{margin:.1em 0 .3em;font-size:18px;letter-spacing:.02em}
  #summary:not(:empty){margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #cdbf9c}
  .reach-list{display:flex;flex-direction:column;gap:8px;margin:14px 0 16px}
  .reach{display:grid;grid-template-columns:1fr auto;gap:3px 10px;width:100%;
         text-align:left;padding:11px 13px;border-radius:9px;
         border:1px solid #b3a684;background:#fff}
  .reach:hover{border-color:var(--accent)}
  .reach.active{border-color:var(--accent);background:var(--accent);color:#fff}
  .reach .r-name{font-weight:600;letter-spacing:.02em}
  .reach .r-count{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
                  font-size:13px;opacity:.7}
  .reach .r-blurb{grid-column:1/-1;font-size:13px;opacity:.8}
  .reach.active .r-blurb,.reach.active .r-count{opacity:.95}
  #begin{font-size:16px;padding:9px 18px}

  #stage{position:relative}
  #mapclip{border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  svg{display:block;width:100%;height:auto;background:var(--sea)}

  /* ---- draggable name placard ---- */
  .placard{position:absolute;left:50%;top:14px;transform:translate(-50%,0);z-index:6;
           background:var(--paper);border:1px solid #9c8f6e;border-radius:8px;
           padding:7px 15px;font-size:19px;font-weight:600;letter-spacing:.05em;
           color:var(--ink);box-shadow:0 7px 18px rgba(0,0,0,.28);
           cursor:grab;user-select:none;touch-action:none;white-space:nowrap;
           animation:cardDrop .5s cubic-bezier(.2,.85,.25,1.1) both}
  .placard::before{content:"";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
                   border-left:8px solid transparent;border-right:8px solid transparent;
                   border-top:16px solid #9c8f6e}
  .placard::after{content:"";position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);
                  border-left:6px solid transparent;border-right:6px solid transparent;
                  border-top:13px solid var(--paper)}
  .placard.grabbing{cursor:grabbing;animation:none;
                    transform:translate(-50%,0) scale(1.04);
                    box-shadow:0 14px 30px rgba(0,0,0,.36)}
  .placard.placed{opacity:.4;pointer-events:none;box-shadow:none}
  @keyframes cardDrop{
    from{transform:translate(-50%,-190%);opacity:0}
    55%{opacity:1}
    to{transform:translate(-50%,0);opacity:1}
  }
  .hud{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
       flex-wrap:wrap;margin:12px 0 6px}
  .prompt{font-size:26px;font-weight:600;letter-spacing:.04em}
  .tier-tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;
            color:#fff;background:#7a6a4a;border-radius:99px;padding:2px 9px;vertical-align:middle}
  .score{font-variant-numeric:tabular-nums}
  .verdict{min-height:1.6em;font-size:15px}
  .swatch{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Orbis Romanus</h1>
  <p class="muted">A Latin name drops onto the map — drag the placard so its pointer rests where the place belonged in the Roman world. Your error is measured in Roman miles.</p>

  <div class="startscreen" id="startscreen">
    <div id="summary"></div>
    <h2>Choose your reach</h2>
    <p class="muted">How far past Rome are you willing to be tested?</p>
    <div class="reach-list" id="reaches"></div>
    <button id="begin">Begin</button>
    <div class="muted" id="loadnote" style="margin-top:10px"></div>
  </div>

  <div class="hud" id="hud" hidden>
    <div><span class="prompt" id="prompt">—</span> <span class="tier-tag" id="tiertag"></span></div>
    <div class="score">Round <span id="idx">0</span>/<span id="total">0</span> · Score <span id="score">0</span></div>
  </div>
  <div class="verdict" id="verdict"></div>

  <div class="row" id="gamebar" hidden>
    <button id="reveal">Reveal &amp; skip</button>
    <button id="quit">End round</button>
  </div>

  <div id="stage" hidden><div id="mapclip"><svg id="map" preserveAspectRatio="xMidYMid meet"></svg></div></div>
</div>

<script src="data/mapdata.js"></script>
<script src="data/places.js"></script>
<script>
(function(){
  const MAP = window.ORBIS_MAP, PLACES = window.ORBIS_PLACES;
  const SVGNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("map");
  const el = id => document.getElementById(id);

  if(!MAP || !PLACES){ el("loadnote").textContent = "Could not load map/place data."; return; }

  const { width:W, height:H, lonMin, lonMax, latMin, latMax } = MAP.meta;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  // ---- projection helpers (equirectangular, exactly invertible) ----------
  const toXY  = (lon,lat) => [ (lon-lonMin)/(lonMax-lonMin)*W, (latMax-lat)/(latMax-latMin)*H ];
  const toLL  = (x,y)     => [ lonMin + x/W*(lonMax-lonMin), latMax - y/H*(latMax-latMin) ];

  function haversineKm(lon1,lat1,lon2,lat2){
    const R=6371, r=Math.PI/180;
    const dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
    const a=Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }
  const kmToRomanMiles = km => Math.round(km/1.48);

  // ---- draw the base map -------------------------------------------------
  function ring(pts){ return pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ")+"Z"; }
  function line(pts){ return pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" "); }

  const gLand   = document.createElementNS(SVGNS,"g");
  const gRivers = document.createElementNS(SVGNS,"g");
  const gPlay   = document.createElementNS(SVGNS,"g");   // guesses/markers live here

  const landPath = document.createElementNS(SVGNS,"path");
  landPath.setAttribute("d", MAP.land.map(ring).join(" "));
  landPath.setAttribute("fill", "var(--land)");
  landPath.setAttribute("stroke", "var(--land-line)");
  landPath.setAttribute("stroke-width", "0.8");
  landPath.setAttribute("fill-rule", "evenodd");
  gLand.appendChild(landPath);

  MAP.rivers.forEach(r=>{
    const p=document.createElementNS(SVGNS,"path");
    p.setAttribute("d", line(r));
    p.setAttribute("fill","none");
    p.setAttribute("stroke","var(--river)");
    p.setAttribute("stroke-width","1");
    p.setAttribute("stroke-linecap","round");
    gRivers.appendChild(p);
  });

  svg.append(gLand, gRivers, gPlay);

  // ---- game state --------------------------------------------------------
  let deck=[], i=0, score=0, awaiting=false, activeReach="provinces";

  // Reach = a cumulative slice of the tiers, chosen on the start screen.
  const REACHES = [
    { id:"provinces", name:"The Provinces",
      blurb:"The governed world — familiar ground and the settled frontier.",
      tiers:["familiar","known"] },
    { id:"frontier", name:"The Frontier",
      blurb:"Past the provinces, to lands Rome knew but barely held.",
      tiers:["familiar","known","obscure"] },
    { id:"world", name:"The Whole Known World",
      blurb:"Every name, out to the legendary edge — Thule, Bactria, the rim of the map.",
      tiers:["familiar","known","obscure","edge"] },
  ];
  const TIER_POINTS = { familiar:1, known:2, obscure:3, edge:4 };

  const reachOf = () => REACHES.find(r=>r.id===activeReach) || REACHES[0];
  const placesFor = reach => PLACES.filter(p=>reach.tiers.includes(p.tier));

  // scoring: bands scale a bit by tier (edge is judged gently)
  function judge(km, tier){
    const slack = tier==="edge" ? 1.8 : tier==="obscure" ? 1.3 : 1;
    if(km < 90*slack)  return {label:"Struck true",  cls:"good", pts:1.0};
    if(km < 260*slack) return {label:"Close",        cls:"ok",   pts:0.6};
    if(km < 550*slack) return {label:"In the region",cls:"fair", pts:0.3};
    return {label:"Lost to Rome", cls:"miss", pts:0};
  }

  function reachButtons(){
    const box=el("reaches");
    box.replaceChildren();
    REACHES.forEach(r=>{
      const b=document.createElement("button");
      b.className="reach"+(r.id===activeReach?" active":"");
      b.dataset.reach=r.id;
      b.innerHTML =
        `<span class="r-name">${r.name}</span>` +
        `<span class="r-count">${placesFor(r).length} places</span>` +
        `<span class="r-blurb">${r.blurb}</span>`;
      b.onclick=()=>{
        activeReach=r.id;
        [...box.children].forEach(c=>c.classList.toggle("active",c.dataset.reach===r.id));
      };
      box.appendChild(b);
    });
  }

  function shuffle(a){ for(let k=a.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[a[k],a[j]]=[a[j],a[k]];} return a; }

  // ---- the draggable name placard -------------------------------------------
  // The card is plain HTML floating over #stage. Its downward pointer (the CSS
  // ::before/::after triangle, tip ~TAIL px below the card box) is the guess
  // point. Drop = submit; grab-without-moving is a no-op so you can regrab.
  const stage = el("stage");
  const TAIL = 16;   // px from card box bottom to the pointer tip (see .placard::before)
  let card=null, dragging=false, moved=false, grabDX=0, grabDY=0,
      curLeft=0, curTop=0, downX=0, downY=0;

  function removeCard(){ if(card){ card.remove(); card=null; } dragging=false; }

  function spawnCard(name){
    removeCard();
    card = document.createElement("div");
    card.className = "placard";
    card.textContent = name;
    stage.appendChild(card);
    const sr = stage.getBoundingClientRect();
    curLeft = sr.width/2; curTop = 14;          // matches the CSS resting spot
    card.addEventListener("pointerdown", onDown);
    card.addEventListener("pointermove", onMove);
    card.addEventListener("pointerup", onUp);
    card.addEventListener("pointercancel", onCancel);
  }

  function onDown(e){
    if(!awaiting) return;
    e.preventDefault();
    dragging = true; moved = false;
    downX = e.clientX; downY = e.clientY;
    card.style.animation = "none";
    card.style.left = curLeft+"px"; card.style.top = curTop+"px";
    card.classList.add("grabbing");
    try{ card.setPointerCapture(e.pointerId); }catch(_){}
    const sr = stage.getBoundingClientRect();
    grabDX = (e.clientX - sr.left) - curLeft;
    grabDY = (e.clientY - sr.top)  - curTop;
  }

  function onMove(e){
    if(!dragging) return;
    const sr = stage.getBoundingClientRect();
    const ch = card.offsetHeight;
    let L = (e.clientX - sr.left) - grabDX;
    let T = (e.clientY - sr.top)  - grabDY;
    L = Math.max(0, Math.min(sr.width, L));                 // tip x within map
    T = Math.max(-(ch+TAIL), Math.min(sr.height-ch-TAIL, T)); // tip y within map
    curLeft = L; curTop = T;
    card.style.left = L+"px"; card.style.top = T+"px";
    if(Math.hypot(e.clientX-downX, e.clientY-downY) > 6) moved = true;
  }

  function onUp(e){
    if(!dragging) return;
    dragging = false;
    try{ card.releasePointerCapture(e.pointerId); }catch(_){}
    card.classList.remove("grabbing");
    if(!moved) return;                 // grabbed but not moved — try again
    const r = card.getBoundingClientRect();
    const pt = svg.createSVGPoint();
    pt.x = r.left + r.width/2;         // tip: horizontal centre of the card
    pt.y = r.bottom + TAIL;            // tip: just below the card box
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    const [lon,lat] = toLL(loc.x, loc.y);
    resolve(lon, lat);
  }

  function onCancel(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove("grabbing");
  }

  function startRound(){
    deck = shuffle(placesFor(reachOf()).slice());
    i=0; score=0; awaiting=false;
    gPlay.replaceChildren();
    removeCard();
    el("summary").innerHTML="";
    el("verdict").innerHTML="";
    el("startscreen").hidden=true;
    el("stage").hidden=false;
    el("gamebar").hidden=false;
    el("hud").hidden=false;
    el("total").textContent=deck.length;
    next();
  }

  function next(){
    el("verdict").innerHTML="";
    if(i>=deck.length){ finish(); return; }
    const p=deck[i];
    el("prompt").textContent=p.name;
    el("tiertag").textContent=p.tier;
    el("idx").textContent=i+1;
    el("score").textContent=Math.round(score);
    el("reveal").disabled=false;
    awaiting=true;
    spawnCard(p.name);
  }

  function dot(x,y,color,r){
    const c=document.createElementNS(SVGNS,"circle");
    c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r||4);
    c.setAttribute("fill",color);c.setAttribute("stroke","#fff");c.setAttribute("stroke-width","1");
    gPlay.appendChild(c); return c;
  }
  function label(x,y,text){
    const t=document.createElementNS(SVGNS,"text");
    t.setAttribute("x",x+7);t.setAttribute("y",y-7);
    t.setAttribute("font-size","13");t.setAttribute("font-family","system-ui,sans-serif");
    t.setAttribute("fill","#fff");t.setAttribute("stroke","#000");t.setAttribute("stroke-width","0.5");
    t.setAttribute("paint-order","stroke");t.textContent=text;
    gPlay.appendChild(t);
  }

  function resolve(guessLon, guessLat){
    if(!awaiting) return;
    awaiting=false; el("reveal").disabled=true;
    if(card) card.classList.add("placed");
    const p=deck[i];
    const [tx,ty]=toXY(p.lon,p.lat);
    const km = guessLon===null ? Infinity : haversineKm(guessLon,guessLat,p.lon,p.lat);
    const v = km===Infinity ? {label:"Skipped",cls:"miss",pts:0} : judge(km,p.tier);
    score += v.pts * (TIER_POINTS[p.tier]||1);

    if(guessLon!==null){
      const [gx,gy]=toXY(guessLon,guessLat);
      const ln=document.createElementNS(SVGNS,"line");
      ln.setAttribute("x1",gx);ln.setAttribute("y1",gy);ln.setAttribute("x2",tx);ln.setAttribute("y2",ty);
      ln.setAttribute("stroke","#fff");ln.setAttribute("stroke-width","1");ln.setAttribute("stroke-dasharray","3 3");
      gPlay.appendChild(ln);
      dot(gx,gy,"#3a3a3a",4);
    }
    dot(tx,ty,"var(--accent)",5);
    label(tx,ty,p.name);

    const dist = km===Infinity ? "—" : kmToRomanMiles(km).toLocaleString()+" Roman miles";
    const note = p.note ? ` — <em>${p.note}</em>` : "";
    el("verdict").innerHTML =
      `<span class="swatch" style="background:var(--${v.cls})"></span> <strong>${v.label}.</strong> ` +
      `${p.name} is <strong>${p.modern}</strong>${note}. Off by ${dist}. ` +
      `<button id="nx">Next →</button>`;
    el("nx").onclick=()=>{ i++; next(); };
    el("score").textContent=Math.round(score);
  }

  function finish(){
    const reach = reachOf();
    const done = i;                       // how many were actually played
    el("hud").hidden=true;
    el("gamebar").hidden=true;
    el("stage").hidden=true;
    el("reveal").disabled=true;
    el("prompt").textContent="—";
    el("verdict").innerHTML="";
    removeCard();
    el("summary").innerHTML =
      `<strong>Round complete.</strong> Final score <strong>${Math.round(score)}</strong> ` +
      `across ${done} ${done===1?"place":"places"} of <em>${reach.name}</em>.`;
    el("begin").textContent="March again";
    el("startscreen").hidden=false;
  }

  el("reveal").onclick=()=>resolve(null,null);
  el("quit").onclick=()=>{ awaiting=false; finish(); };
  el("begin").onclick=startRound;

  reachButtons();
  el("loadnote").textContent = `${PLACES.length} places · map ${W}×${H}`;
})();
</script>
</body>
</html>
